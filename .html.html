<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mechanical Properties Web</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 100px;
}

input {
  padding: 10px;
  font-size: 18px;
  width: 300px;
}

.popup {
  position: fixed;
  top: 25%;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 20px;
  border: 2px solid black;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<h1>Mechanical Properties Finder</h1>
<input id="materialInput" placeholder="Enter material (steel, aluminum, copper)" />

<div id="popup1" class="popup hidden"></div>

<div id="popup2" class="popup hidden">
  <canvas id="chart"></canvas>
</div>

<script>

const materials = {
  steel: {
    fracture_toughness: "50 MPa√m",
    tensile_strength: "400 MPa",
    youngs_modulus: "200 GPa",
    poisson_ratio: "0.30",
    stress_strain: [
      {x:0,y:0},{x:0.01,y:200},{x:0.02,y:300},{x:0.03,y:350},{x:0.05,y:400}
    ]
  }
};

let step = 0;
let chartInstance = null;

document.getElementById("materialInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    const input = this.value.toLowerCase().trim();
    const data = materials[input];

    if (!data) {
      alert("Material not found!");
      return;
    }

    if (step === 0) {
      showProperties(data, input);
      step = 1;
    } else {
      showGraph(data);
      step = 0;
    }
  }
});

function showProperties(data, name) {
  const popup = document.getElementById("popup1");

  popup.innerHTML = `
    <h2>${name.toUpperCase()}</h2>
    <p>Fracture Toughness: ${data.fracture_toughness}</p>
    <p>Tensile Strength: ${data.tensile_strength}</p>
    <p>Young's Modulus: ${data.youngs_modulus}</p>
    <p>Poisson Ratio: ${data.poisson_ratio}</p>
  `;

  popup.classList.remove("hidden");
}

function showGraph(data) {

  document.getElementById("popup1").classList.add("hidden");

  const popup2 = document.getElementById("popup2");
  popup2.classList.remove("hidden");

  const ctx = document.getElementById("chart").getContext("2d");

  if (chartInstance) {
    chartInstance.destroy();
  }

  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      datasets: [{
        label: "Stress-Strain Curve",
        data: data.stress_strain,
        parsing: { xAxisKey: 'x', yAxisKey: 'y' }
      }]
    }
  });
}

</script>

</body>
</html>
