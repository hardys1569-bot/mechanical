<!DOCTYPE html>
<html>
<head>
<title>Mechanical</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>Mechanical Properties Finder</h1>

<input id="materialInput" placeholder="Enter material..." />

<div id="popup1"></div>
<canvas id="chart"></canvas>

<script>

const materials = {
  steel: {
    fracture_toughness: "50 MPa√m",
    tensile_strength: "400 MPa",
    youngs_modulus: "200 GPa",
    poisson_ratio: "0.30",
    stress_strain: [
      {x:0,y:0},{x:0.01,y:200},{x:0.02,y:300},{x:0.03,y:350},{x:0.05,y:400}
    ]
  }
};

document.getElementById("materialInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {

    let input = this.value.toLowerCase();
    let data = materials[input];

    if (!data) {
      alert("not found");
      return;
    }

    document.getElementById("popup1").innerHTML =
      "Tensile: " + data.tensile_strength;

    const ctx = document.getElementById("chart");

    new Chart(ctx, {
      type: "line",
      data: {
        datasets: [{
          label: "curve",
          data: data.stress_strain
        }]
      }
    });
  }
});

</script>

</body>
</html>
